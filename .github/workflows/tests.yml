# Runs the database rule tests and the browser tests on every pull request
# (and on main), so a change that breaks something shows a red ✗ before merging.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Database rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/package-lock.json') }}
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-e2e-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Install the tools the tests use
        run: |
          for d in tools/demo-seed tools/reset-login tools/backup tests/e2e; do (cd "$d" && npm ci); done
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - name: Keep screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/shots/
          if-no-files-found: ignore
